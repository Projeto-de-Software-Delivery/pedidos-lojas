name: CI/CD Delivery

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: delivery
          POSTGRES_USER: usuario
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U usuario -d delivery"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: delivery
      DB_USER: usuario
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    permissions:
      contents: write
      pull-requests: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: emilybrtt
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: emilybrtt/delivery:${{ github.sha }}

      - name: Deploy na EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST_TEST }}
          username: ubuntu
          key: ${{ secrets.KEY_TEST }}
          port: 22
          script: |
            docker stop delivery || true
            docker rm --force delivery || true

            # Remove imagens sem container (deploys antigos, tag = SHA). Sem isso o disco da
            # EC2 enche e o pull falha com "no space left on device" (KAN-80).
            docker image prune -af

            docker pull emilybrtt/delivery:${{ github.sha }}

            docker run -d \
              --name delivery \
              --network rede-delivery \
              -p 8081:8080 \
              -e DB_HOST=postgres-delivery \
              -e DB_PORT=5432 \
              -e DB_NAME=delivery \
              -e DB_USER=usuario \
              -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              -e RABBITMQ_HOST=rabbitmq \
              -e RABBITMQ_PORT=5672 \
              -e RABBITMQ_USER=guest \
              -e RABBITMQ_PASSWORD=guest \
              -e ENTREGADOR_SERVICE_URL=http://3.239.184.234:8081 \
              emilybrtt/delivery:${{ github.sha }}
