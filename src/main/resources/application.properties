spring.application.name=delivery

server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:delivery}
spring.datasource.username=${DB_USER:usuario}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
# schema.sql corrige constraints que o ddl-auto=update não atualiza (ver o arquivo)
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

entregador.service.url=${ENTREGADOR_SERVICE_URL:http://localhost:8081}
